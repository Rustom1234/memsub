[project]
name = "memory-sublayer"
version = "0.1.0"
description = "Local-first, zero-infrastructure memory for AI agents (SQLite + local embeddings + a policy layer), served over MCP"
requires-python = ">=3.12"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]
api = ["anthropic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["memsub"]
