[pytest]
# The host has ROS pytest plugins on the system path that fail to import
# (missing yaml). Disable third-party plugin autoload; the suite needs none.
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_flake8 -p no:ament_pep257 -p no:ament_copyright -p no:ament_lint -p no:ament_xmllint
testpaths = tests
